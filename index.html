<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de tarifs UGC</title>
  <style>
    :root{--bg:#fff9fc;--card:#fff;--text:#181518;--muted:#776d74;--line:#eadde4;--pink:#f3c6d8;--pink-soft:#fae6ee;--violet-soft:#f3edff;--shadow:0 18px 50px rgba(72,38,58,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,rgba(250,230,238,.95),transparent 30%),radial-gradient(circle at 100% 100%,rgba(225,212,250,.55),transparent 28%),var(--bg)}
    button,input,select,textarea{font:inherit}.app{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:24px 0}.shell{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
    .header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:28px;border-bottom:1px solid var(--line)}.eyebrow{display:inline-block;margin-bottom:8px;color:#8d6275;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-.04em}.header p{margin:10px 0 0;color:var(--muted);line-height:1.55;max-width:700px}.tag{flex:none;padding:10px 14px;border-radius:999px;background:var(--pink-soft);color:#6d4053;font-size:12px;font-weight:900}
    .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.8fr);gap:22px;padding:24px}.form-card,.result-card{background:var(--card);border:1px solid var(--line);border-radius:22px}.form-card{padding:22px}.result-card{padding:22px;height:max-content;position:sticky;top:18px}.field{display:grid;gap:8px;margin-bottom:18px}.field:last-child{margin-bottom:0}label{font-size:13px;line-height:1.2;font-weight:850}
    input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--text);background:#fff;outline:none;line-height:1.25}textarea{min-height:94px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(243,198,216,.17)}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.money{position:relative}.money input{padding-right:40px}.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:900;pointer-events:none}
    .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option-card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer;transition:.18s ease;user-select:none}.option-card:hover{border-color:var(--pink);transform:translateY(-1px)}.option-card.active{border-color:#d59ab2;background:linear-gradient(135deg,var(--pink-soft),#fff);box-shadow:inset 0 0 0 1px rgba(213,154,178,.15)}.option-card input{position:absolute;opacity:0;pointer-events:none}.option-name{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:800;line-height:1.25}.option-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:#f7f2f5;color:transparent;font-size:14px;font-weight:900;transition:.18s ease}.option-card.active .option-dot{background:#181518;color:#fff}.option-price{flex:none;color:var(--muted);font-size:12px;font-weight:850;white-space:nowrap}
    .result-title{color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.total{margin-top:8px;font-size:clamp(40px,5vw,58px);line-height:1;letter-spacing:-.05em;font-weight:950}.separator{height:1px;background:var(--line);margin:20px 0}.breakdown{display:grid;gap:13px}.breakdown-row{display:flex;align-items:center;justify-content:space-between;gap:18px;color:var(--muted);font-size:14px;line-height:1.25}.breakdown-row strong{color:var(--text);font-size:15px;white-space:nowrap}.advice{margin-top:18px;padding:15px 16px;border-radius:16px;background:linear-gradient(135deg,var(--pink-soft),var(--violet-soft));color:#684457;font-size:13px;line-height:1.55}.copy-btn{width:100%;margin-top:16px;min-height:48px;border:0;border-radius:14px;background:#181518;color:#fff;font-weight:900;cursor:pointer;transition:.18s ease}.copy-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(24,21,24,.14)}.status{min-height:18px;margin:10px 0 0;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.result-card{position:static}}@media(max-width:620px){.app{width:min(100% - 10px,1120px);padding:6px 0}.shell{border-radius:20px}.header{padding:18px;flex-direction:column}.layout{padding:12px}.two-cols,.options-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app"><section class="shell">
    <header class="header"><div><span class="eyebrow">YouGC Academy</span><h1>💸 Calculateur de tarifs UGC</h1><p>Estime ton tarif, ajuste-le selon le brief et copie un récapitulatif prêt à utiliser.</p></div><div class="tag">Tarif indicatif</div></header>
    <div class="layout">
      <section class="form-card">
        <div class="two-cols"><div class="field"><label for="level">Ton niveau</label><select id="level"><option value="Débutante">Débutante</option><option value="Intermédiaire" selected>Intermédiaire</option><option value="Confirmée">Confirmée</option></select></div><div class="field"><label for="service">Type de prestation</label><select id="service"><option value="Vidéo UGC">Vidéo UGC</option><option value="Pack de vidéos">Pack de vidéos</option><option value="Photos">Photos</option><option value="Retainer mensuel">Retainer mensuel</option><option value="Autre">Autre</option></select></div></div>
        <div class="two-cols"><div class="field"><label for="baseRate">Tarif de base par contenu</label><div class="money"><input id="baseRate" type="number" min="0" step="10" value="220"><span>€</span></div></div><div class="field"><label for="quantity">Nombre de contenus</label><input id="quantity" type="number" min="1" step="1" value="1"></div></div>
        <div class="field"><label>Options</label><div class="options-grid" id="optionsGrid"></div></div>
        <div class="two-cols"><div class="field"><label for="usage">Droits d’usage</label><select id="usage"><option value="Organique" data-rate="0">Organique — inclus</option><option value="Ads 1 mois" data-rate="0.4">Ads 1 mois — +40 %</option><option value="Ads 3 mois" data-rate="0.75">Ads 3 mois — +75 %</option><option value="Ads 6 mois" data-rate="1.25">Ads 6 mois — +125 %</option><option value="Usage illimité" data-rate="2">Usage illimité — +200 %</option><option value="Whitelisting / Spark Ads" data-rate="1">Whitelisting — +100 %</option></select></div><div class="field"><label for="exclusivity">Exclusivité</label><select id="exclusivity"><option value="Aucune" data-rate="0">Aucune</option><option value="1 mois" data-rate="0.2">1 mois — +20 %</option><option value="3 mois" data-rate="0.4">3 mois — +40 %</option><option value="6 mois" data-rate="0.7">6 mois — +70 %</option></select></div></div>
        <div class="two-cols"><div class="field"><label for="fees">Frais supplémentaires</label><div class="money"><input id="fees" type="number" min="0" step="5" value="0"><span>€</span></div></div><div class="field"><label for="announced">Tarif annoncé à la marque</label><div class="money"><input id="announced" type="number" min="0" step="10" value="0"><span>€</span></div></div></div>
        <div class="field"><label for="notes">Notes facultatives</label><textarea id="notes" placeholder="Ajoute ici une précision sur le brief ou la négociation..."></textarea></div>
      </section>
      <aside class="result-card"><div class="result-title">Estimation recommandée</div><div class="total" id="total">0 €</div><div class="separator"></div><div class="breakdown"><div class="breakdown-row"><span>Création</span><strong id="creationTotal">0 €</strong></div><div class="breakdown-row"><span>Options</span><strong id="optionsTotal">0 €</strong></div><div class="breakdown-row"><span>Droits d’usage</span><strong id="usageTotal">0 €</strong></div><div class="breakdown-row"><span>Exclusivité</span><strong id="exclusivityTotal">0 €</strong></div><div class="breakdown-row"><span>Frais</span><strong id="feesTotal">0 €</strong></div></div><div class="advice" id="advice"></div><button class="copy-btn" id="copyBtn">📋 Copier le récapitulatif</button><p class="status" id="status"></p></aside>
    </div>
  </section></main>
<script>
const optionsCatalog=[{name:"Script",amount:60},{name:"Recherche créative",amount:80},{name:"Montage avancé",amount:100},{name:"Sous-titres",amount:35},{name:"Variations de hook",amount:50},{name:"Rushs",rate:.30},{name:"Livraison express",rate:.30},{name:"Photos supplémentaires",amount:60}];
const $=id=>document.getElementById(id);const currency=v=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v||0);const optionsGrid=$("optionsGrid");
optionsCatalog.forEach((option,index)=>{const card=document.createElement("label");card.className="option-card";card.innerHTML=`<input type="checkbox" data-index="${index}"><span class="option-name"><span class="option-dot">✓</span>${option.name}</span><span class="option-price">${option.amount?`+${option.amount} €`:`+${Math.round(option.rate*100)} %`}</span>`;optionsGrid.appendChild(card);const input=card.querySelector("input");input.addEventListener("change",()=>{card.classList.toggle("active",input.checked);calculate()})});
function selectedRate(select){return Number(select.options[select.selectedIndex].dataset.rate||0)}
function calculate(){const baseRate=Number($("baseRate").value||0);const quantity=Math.max(1,Number($("quantity").value||1));const creation=baseRate*quantity;let optionsTotal=0;const selectedOptions=[];document.querySelectorAll("#optionsGrid input:checked").forEach(input=>{const option=optionsCatalog[Number(input.dataset.index)];selectedOptions.push(option.name);optionsTotal+=option.amount||creation*option.rate});const usageTotal=creation*selectedRate($("usage"));const exclusivityTotal=creation*selectedRate($("exclusivity"));const fees=Number($("fees").value||0);const announced=Number($("announced").value||0);const total=creation+optionsTotal+usageTotal+exclusivityTotal+fees;$("creationTotal").textContent=currency(creation);$("optionsTotal").textContent=currency(optionsTotal);$("usageTotal").textContent=currency(usageTotal);$("exclusivityTotal").textContent=currency(exclusivityTotal);$("feesTotal").textContent=currency(fees);$("total").textContent=currency(total);if(announced>0&&announced<total){$("advice").textContent="⚠️ Ton tarif annoncé est inférieur à l’estimation recommandée. Vérifie que tu ne sous-factures pas les options, les droits ou ton temps."}else if(announced>=total&&announced>0){$("advice").textContent="✨ Ton tarif annoncé couvre l’estimation recommandée. Tu peux préparer ta proposition avec confiance."}else{$("advice").textContent="💗 Cette estimation reste une base. Ajuste-la selon la complexité du brief, les délais, la marque et la valeur créée."}return{level:$("level").value,service:$("service").value,baseRate,quantity,selectedOptions,usage:$("usage").value,exclusivity:$("exclusivity").value,fees,announced,notes:$("notes").value.trim(),total}}
function summary(data){return["💸 Estimation tarif UGC",`Niveau : ${data.level}`,`Prestation : ${data.service}`,`Nombre de contenus : ${data.quantity}`,`Tarif de base : ${currency(data.baseRate)}`,`Options : ${data.selectedOptions.length?data.selectedOptions.join(", "):"Aucune"}`,`Droits d’usage : ${data.usage}`,`Exclusivité : ${data.exclusivity}`,`Frais supplémentaires : ${currency(data.fees)}`,`Total recommandé : ${currency(data.total)}`,data.announced?`Tarif annoncé : ${currency(data.announced)}`:"",data.notes?`Notes : ${data.notes}`:""].filter(Boolean).join("\n")}
["level","service","baseRate","quantity","usage","exclusivity","fees","announced","notes"].forEach(id=>{$(id).addEventListener("input",calculate);$(id).addEventListener("change",calculate)});$("copyBtn").addEventListener("click", async () => {
  const recap = summary(calculate());

  // Méthode moderne si disponible
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(recap);
      $("status").textContent = "Récapitulatif copié ✅";
      return;
    }
  } catch (e) {}

  // Fallback compatible avec Notion / fichiers locaux / certains navigateurs
  try {
    const textarea = document.createElement("textarea");
    textarea.value = recap;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    textarea.style.pointerEvents = "none";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);

    const copied = document.execCommand("copy");
    document.body.removeChild(textarea);

    if (copied) {
      $("status").textContent = "Récapitulatif copié ✅";
      return;
    }
  } catch (e) {}

  // Dernier recours : affiche le texte dans une boîte sélectionnable
  const fallback = document.createElement("div");
  fallback.style.marginTop = "12px";
  fallback.style.padding = "12px";
  fallback.style.border = "1px solid #eadde4";
  fallback.style.borderRadius = "12px";
  fallback.style.background = "#fff";
  fallback.innerHTML = `
    <strong style="display:block;margin-bottom:8px;">Copie ton récapitulatif :</strong>
    <textarea id="fallbackRecap" style="width:100%;min-height:180px;border:1px solid #eadde4;border-radius:10px;padding:10px;resize:vertical;">${recap.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
  `;
  $("status").textContent = "Sélectionne le texte ci-dessous puis copie-le.";
  $("status").insertAdjacentElement("afterend", fallback);
  const ta = fallback.querySelector("#fallbackRecap");
  ta.focus();
  ta.select();
});calculate();
</script>
</body>
</html>
